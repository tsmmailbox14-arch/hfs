theme_admin:
  css: |
    main div:has(p:has(span)), 
    main div:has(> p), 
    .MuiCard-root, 
    div:has(> p) { 
      display: none !important; 
    }

    main .MuiAlert-root, 
    main div[role="alert"] { 
      display: none !important; 
    }

    main img, 
    main a[href*="rejetto.com"], 
    main a[href*="github.com"] { 
      display: none !important; 
    }

    main p { 
      display: none !important; 
    }
