name: Build Custom HFS Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Используем Node 20, так как под нее у pkg есть стабильные бинарники

    - name: Install Monorepo Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Inject Cleanup Script and Compile Frontend
      shell: powershell
      run: |
        # Собираем фронтенд админки
        npx esbuild admin/src/index.ts --bundle --minify --platform=browser --outfile=admin/index.js
        
        # Создаем скрипт очистки
        $cleanScript = @'
        const bypassHome = () => {
            if (window.location.pathname.endsWith('/admin') || window.location.pathname.endsWith('/admin/')) {
                window.location.replace('/~/admin/files');
            }
        };
        bypassHome();
        window.addEventListener('popstate', bypassHome);
        document.addEventListener("DOMContentLoaded", () => {
            const cleanAdminPanel = () => {
                bypassHome();
                const sidebarHomeBtn = document.querySelector('a[href="/~/admin"], a[href="/~/admin/"]');
                if (sidebarHomeBtn) {
                    const sidebarItem = sidebarHomeBtn.closest('li');
                    if (sidebarItem) sidebarItem.remove();
                }
                document.querySelectorAll('main p, main span, main a, main h4, main h2, main .MuiCard-root, main .MuiPaper-root').forEach(el => {
                    const nodeText = el.textContent || "";
                    if (nodeText.includes("Random plugin") || nodeText.includes("Statistics") || nodeText.includes("Admin-panel") || nodeText.includes("documentation") || nodeText.includes("by") || nodeText.includes("Dashboard") || nodeText.includes("working") || nodeText.includes("localhost")) {
                        const gridItem = el.closest('.MuiGrid-item, .MuiPaper-root, .MuiCard-root');
                        if (gridItem) gridItem.remove();
                        else el.remove();
                    }
                });
                document.querySelectorAll('[role="alert"], .MuiAlert-root, main img').forEach(node => node.remove());
            };
            cleanAdminPanel();
            setTimeout(cleanAdminPanel, 200);
            setInterval(cleanAdminPanel, 500);
        });
        '@
        Set-Content -Path "clean.js" -Value $cleanScript -Encoding utf8
        
        # Безопасно склеиваем файлы
        Get-Content admin/index.js, clean.js | Set-Content admin/index.js.tmp
        Move-Item -Force admin/index.js.tmp admin/index.js
        
        # Собираем основной публичный фронтенд
        npx esbuild frontend/src/index.ts --bundle --minify --platform=browser --outfile=frontend/index.js

    - name: Compile Backend Server
      run: |
        npx esbuild src/index.ts --bundle --platform=node --target=node20 --outfile=src/index.js --external:@hfs/shared --external:fsevents

    - name: Prepare Windows Distribution Folder
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        Copy-Item "package.json" -Destination "dist\"
        if (Test-Path "central.json") { Copy-Item "central.json" -Destination "dist\" }
        Copy-Item "README.md" -Destination "dist\"
        Copy-Item -Recurse -Force "admin" -Destination "dist\admin"
        Copy-Item -Recurse -Force "src" -Destination "dist\src"
        Copy-Item -Recurse -Force "frontend" -Destination "dist\frontend"

        # Корректируем package.json, чтобы pkg понимал структуру
        $jsonPath = "dist/package.json"
        $json = Get-Content $jsonPath | ConvertFrom-Json
        $json.PSObject.Properties.Remove('devDependencies')
        $json.PSObject.Properties.Remove('workspaces')
        if ($json.scripts) { $json.scripts.PSObject.Properties.Remove('postinstall') }
        
        # КРИТИЧНО: Указываем точку входа для pkg и прописываем пути к ассетам
        $json | Add-Member -Type NoteProperty -Name "main" -Value "src/index.js" -Force
        $pkgConfig = @{
            assets = @("admin/**/*", "frontend/**/*")
        }
        $json | Add-Member -Type NoteProperty -Name "pkg" -Value $pkgConfig -Force

        $json | ConvertTo-Json -Depth 100 | Set-Content $jsonPath

    - name: Install Clean Production Modules
      run: |
        cd dist
        npm install --omit=dev --legacy-peer-deps

    - name: Force Package to Windows EXE
      run: |
        cd dist
        # Собираем исполняемый файл непосредственно из папки дистрибутива
        npx pkg package.json --targets node20-win-x64 --output hfs-windows-x64-3.3.4.exe

    - name: Save and Upload Finished File
      uses: actions/upload-artifact@v4
      with:
        name: hfs-windows-x64-custom
        path: dist/hfs-windows-x64-3.3.4.exe
