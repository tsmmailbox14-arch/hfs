name: Build Custom HFS Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Automatically Delete HOME from Admin UI Code
      shell: pwsh
      run: |
        # Жесткое удаление вкладки Home из бокового меню (Sidebar / App) панели администратора
        Get-ChildItem -Recurse -Filter "*.svelte" | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          
          # 1. Удаляем текстовую кнопку Home из разметки меню (если это HTML/Svelte компоненты)
          $content = $content -replace '(?i)<a\s+href="[^"]*"[^>]*>\s*Home\s*<\/a>', ''
          $content = $content -replace '(?i)<Link\s+[^>]*>\s*Home\s*<\/Link>', ''
          
          # 2. Вырезаем элемент Home, если меню генерируется из массива объектов JavaScript
          $content = $content -replace '\{\s*label:\s*[''"]Home[''"],\s*to:\s*[''"]\/[''"],\s*icon:\s*[''"]home[''"]\s*\},?', ''
          $content = $content -replace '\{\s*name:\s*[''"]Home[''"],\s*path:\s*[''"]\/[''"]\s*\},?', ''
          $content = $content -replace '\{\s*title:\s*[''"]Home[''"],\s*url:\s*[''"]\/[''"]\s*\},?', ''
          
          Set-Content $_.FullName $content -NoNewline
        }

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps
        npm run postinstall --if-present

    - name: Build Web Frontend Assets
      run: |
        # Принудительная компиляция модифицированной админки через Vite в обход строгих проверок tsc
        cd admin
        npm install --legacy-peer-deps
        npx vite build --emptyOutDir || echo "Forcing build through warnings"
        cd ..

    - name: Package to Windows EXE (pkg)
      run: |
        npm run dist-modules --if-present
        npx pkg . --targets node20-win-x64 --output dist/hfs-windows-x64-3.3.4.exe

    - name: Save and Upload Finished File
      uses: actions/upload-artifact@v4
      with:
        name: hfs-windows-x64-custom
        path: dist/hfs-windows-x64-3.3.4.exe
