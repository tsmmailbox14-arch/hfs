name: Build HFS v3 with patched Admin Panel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Patch Admin Frontend (Hide HOME tab)
        run: |
          if [ -d "admin/src" ]; then
            echo 'a[href="#/"], .nav-link[href="#/"], [data-testid="menu-home"] { display: none !important; }' >> admin/src/index.css
          elif [ -d "frontend/src" ]; then
            echo 'a[href="#/"], .nav-link[href="#/"], [data-testid="menu-home"] { display: none !important; }' >> frontend/src/index.css
          else
            echo 'a[href="#/"], .nav-link[href="#/"], [data-testid="menu-home"] { display: none !important; }' >> src/index.css
          fi

      - name: Build HFS v3 Project
        run: npm run build-all || npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hfs-patched-build
          path: |
            dist/
            build/
            package.json
