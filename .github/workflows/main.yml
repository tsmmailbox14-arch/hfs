    - name: Inject Word/Excel Protocol Script and Compile Frontend
      shell: powershell
      run: |
        # 1. Собираем основной фронтенд пользователей
        npm run build --workspace=frontend
        
        # 2. Создаем скрипт подмены ссылок для открытия в локальном Office
        $officeScript = @'
        document.addEventListener("DOMContentLoaded", () => {
            const patchOfficeLinks = () => {
                document.querySelectorAll('a[href*="/vfs/"], button[data-test="download"]').forEach(el => {
                    let url = el.tagName === 'A' ? el.href : el.getAttribute('data-url');
                    if (!url) return;
                    
                    if (!url.startsWith('ms-word:') && !url.startsWith('ms-excel:')) {
                        if (url.toLowerCase().endsWith('.docx') || url.toLowerCase().endsWith('.doc')) {
                            if (el.tagName === 'A') {
                                el.href = `ms-word:ofe|u|${url}`;
                            } else {
                                el.onclick = () => { window.location.href = `ms-word:ofe|u|${url}`; };
                            }
                        } else if (url.toLowerCase().endsWith('.xlsx') || url.toLowerCase().endsWith('.xls')) {
                            if (el.tagName === 'A') {
                                el.href = `ms-excel:ofe|u|${url}`;
                            } else {
                                el.onclick = () => { window.location.href = `ms-excel:ofe|u|${url}`; };
                            }
                        }
                    }
                });
            };
            patchOfficeLinks();
            setTimeout(patchOfficeLinks, 500);
            setInterval(patchOfficeLinks, 1500);
        });
        '@
        Set-Content -Path "office-patch.js" -Value $officeScript -Encoding utf8
        
        # 3. Внедряем наш скрипт в скомпилированный фронтенд веб-клиента
        # В зависимости от структуры сборки, выходной файл лежит в frontend/dist/index.js или frontend/index.js
        $frontendPath = "frontend/index.js"
        if (!(Test-Path $frontendPath)) { $frontendPath = "dist/frontend/index.js" }
        
        if (Test-Path $frontendPath) {
            Get-Content $frontendPath, office-patch.js | Set-Content $frontendPath.tmp
            Move-Item -Force $frontendPath.tmp $frontendPath
        }
